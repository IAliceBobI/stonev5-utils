name: Publish

# 推送 v* 标签时触发：测试 → 构建 → trusted publishing (OIDC) 发布
# 前置条件：npmjs.com 包设置里已配置 Trusted Publishing 指向本文件（publish.yml）
# 发布流程：改代码 → npm version patch（自动 commit + tag）→ git push && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  id-token: write  # OIDC 必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'  # trusted publishing 要求 Node >= 22.14 / npm >= 11.5.1
          registry-url: https://registry.npmjs.org
      - name: 校验 tag 与 package.json 版本一致
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish  # 公开仓库走 trusted publishing，provenance 自动生成，无需 token/OTP
